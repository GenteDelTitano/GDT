<h1>📧 Scrivici</h1>
<p class="subtitle" style="text-align: center !important;">
    <strong>✍️ Compila il modulo per inviarci un messaggio.<br>
        ⏰ Ti risponderemo al più presto.
    </strong>
</p>

<div style="background: #f8faff; padding: 30px; border-radius: 12px; border: 1px solid #e8edf5; max-width: 700px; margin: 0 auto;">
    <!-- Form EmailJS -->
    <form id="contact-form" onsubmit="return false;">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- COLONNA DI SINISTRA -->
            <div class="form-group">
                <label for="user_name" class="form-label">👤 Nome Completo *</label>
                <input type="text" id="user_name" name="name" class="form-input" 
                    autocomplete="name" required placeholder="Mario Rossi" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">
                
                <label for="user_email" class="form-label">✉️ La tua Email *</label>
                <input type="email" id="user_email" name="email" class="form-input" 
                    autocomplete="email" required placeholder="mario@email.it" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">
                
                <label for="message" class="form-label">💬 Il tuo Messaggio *</label>
                <textarea id="message" name="message" class="form-input" rows="8" 
                        autocomplete="off" required placeholder="Scrivi qui il tuo messaggio..." style="width: 100%; box-sizing: border-box; resize: vertical;"></textarea>
            </div>

            <!-- COLONNA DI DESTRA -->
            <div class="form-group" style="display: flex; flex-direction: column; justify-content: space-between;">
                
                <!-- Parte superiore: Campo Telefono -->
                <div>
                    <label for="user_phone" class="form-label">📱 Numero di Telefono (Opzionale)</label>
                    <input type="tel" id="user_phone" name="telefono" class="form-input" 
                        autocomplete="tel" placeholder="333 1234567" style="width: 100%; box-sizing: border-box;">
                </div>
                
                <!-- Contenitore inferiore: Bottone + Nota di Attenzione -->
                <div style="margin-top: 54px;">
                    <!-- Pulsante Invia Messaggio -->
                    <p style="text-align: center !important; margin: 0 0 20px 0;">
                        <button type="button" id="submit-btn" class="btn-invia" style="width: 100%; box-sizing: border-box; padding: 12px 0;">
                            <span id="btn-text">📨 Invia Messaggio</span>
                            <span id="btn-loading" style="display: none;">⏳ Invio in corso...</span>
                        </button>
                    </p>

                    <!-- Blocco Nota Attenzione -->
                    <div class="note-evidenziate" style="padding: 10px; border-radius: 8px;"> 
                        <p style="text-align: center !important; margin: 0;">
                            <strong>*** Attenzione ***<br>
                            Limitare l'uso dei dati sensibili.</strong>
                        </p>
                    </div>
                </div>

            </div>
        </div>
        
        <!-- Stato dell'invio -->
        <div id="form-status" style="text-align: center; margin-top: 15px; font-weight: bold; font-size: 1.05rem;"></div>
    </form>
</div>

<!-- Contatore visite su Firebase -->
<script>
(function() {
    const DB_URL = "https://gente-del-titano-default-rtdb.europe-west1.firebasedatabase.app";
    
    fetch(DB_URL + '/visite/scrivici.json')
        .then(function(res) { return res.json(); })
        .then(function(valoreAttuale) {
            const nuovoValore = (valoreAttuale || 0) + 1;
            fetch(DB_URL + '/visite/scrivici.json', {
                method: 'PUT',
                body: JSON.stringify(nuovoValore)
            });
        })
        .catch(function(e) { console.warn("Firebase non raggiungibile"); });
})();
</script>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>

<!-- Script EmailJS (layout formsubmit style) -->
<script>
(function() {
    console.log('🚀 Script scrivici EmailJS caricato!');

    function initForm() {
        console.log('📄 Inizializzazione form...');

        const form = document.getElementById('contact-form');
        const btn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoading = document.getElementById('btn-loading');
        const statusDiv = document.getElementById('form-status');

        if (!form || !btn) {
            console.error('❌ Elementi del form non trovati!');
            return;
        }

        // Inizializza EmailJS
        try {
            emailjs.init({
                publicKey: "dlcgcFKY-gzS7RQKJ",
            });
            console.log('✅ EmailJS inizializzato!');
        } catch (error) {
            console.error('❌ Errore EmailJS:', error);
            statusDiv.innerHTML = '❌ Errore di configurazione.';
            statusDiv.style.color = '#dc3545';
            return;
        }

        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            console.log('🔘 Click su Invia!');

            // Raccolta dati
            const name = document.getElementById('user_name').value.trim();
            const email = document.getElementById('user_email').value.trim();
            const telefono = document.getElementById('user_phone').value.trim();
            const message = document.getElementById('message').value.trim();

            // Validazione
            if (!name) {
                statusDiv.innerHTML = '❌ Inserisci il tuo Nome.';
                statusDiv.style.color = '#dc3545';
                document.getElementById('user_name').focus();
                return;
            }
            if (!email || !email.includes('@')) {
                statusDiv.innerHTML = '❌ Inserisci una Email valida.';
                statusDiv.style.color = '#dc3545';
                document.getElementById('user_email').focus();
                return;
            }
            if (!message) {
                statusDiv.innerHTML = '❌ Scrivi il tuo messaggio.';
                statusDiv.style.color = '#dc3545';
                document.getElementById('message').focus();
                return;
            }

            // Stato caricamento
            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            statusDiv.innerHTML = '⏳ Invio in corso...';
            statusDiv.style.color = '#0886f5fb';

            // Data formattata in italiano
            const now = new Date();
            const time = now.toLocaleString('it-IT', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            console.log('📅 Data formattata:', time);

            // 🔥 SUBJECT DINAMICO (come su Web3Forms)
            const subject = `Messaggio dal sito Gente del Titano da ${name}`;

            // Invio EmailJS
            emailjs.send("service_f726zbu", "template_sdsez1q", {
                title: subject,          // <-- SUBJECT DINAMICO
                name: name,
                email: email,
                telefono: telefono || 'Non indicato',
                time: time,
                message: message,
                year: now.getFullYear()
            })
            .then(function(response) {
                console.log('✅ Inviato!', response);
                statusDiv.innerHTML = '✅ Messaggio inviato con successo!';
                statusDiv.style.color = '#28a745';
                form.reset();
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                setTimeout(function() { statusDiv.innerHTML = ''; }, 8000);
            })
            .catch(function(error) {
                console.error('❌ Errore:', error);
                statusDiv.innerHTML = '❌ Errore durante l\'invio. Riprova.';
                statusDiv.style.color = '#dc3545';
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            });
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            return false;
        });

        console.log('✅ Form pronto!');
        statusDiv.innerHTML = '✅ Pronto per l\'invio!';
        statusDiv.style.color = '#28a745';
        setTimeout(function() { statusDiv.innerHTML = ''; }, 3000);
    }

    // Attesa caricamento EmailJS
    function waitForEmailJS(retries) {
        retries = retries || 0;
        if (typeof emailjs !== 'undefined') {
            console.log('✅ EmailJS trovato!');
            initForm();
            return;
        }
        if (retries > 30) {
            console.error('❌ EmailJS non caricato!');
            document.getElementById('form-status').innerHTML = '❌ Errore di caricamento. Ricarica.';
            document.getElementById('form-status').style.color = '#dc3545';
            return;
        }
        console.log('⏳ Attendendo EmailJS... (' + (retries + 1) + '/30)');
        setTimeout(function() { waitForEmailJS(retries + 1); }, 200);
    }

    waitForEmailJS();
})();
</script>
