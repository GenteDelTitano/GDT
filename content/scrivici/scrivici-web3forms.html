<h1>📧 Scrivici</h1>
<p class="subtitle" style="text-align: center !important;">
    <strong>✍️ Compila il modulo per inviarci un messaggio.<br>
        ⏰ Ti risponderemo al più presto.
    </strong>
</p>

<div style="background: #f8faff; padding: 30px; border-radius: 12px; border: 1px solid #e8edf5; max-width: 700px; margin: 0 auto;">
    <!-- Form Web3Forms -->
    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">

        <!-- 🔑 CHIAVE WEB3FORMS -->
        <input type="hidden" name="access_key" value="eb8e48b3-fa82-41d2-bb69-05ba856db334" />
        
        <!-- 🏷️ Nome del mittente -->
        <input type="hidden" name="from_name" value="Associazione Gente del Titano" />
        
        <!-- ⚙️ CONFIGURAZIONI -->
        <input type="hidden" name="_template" value="basic" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_redirect" value="https://gentedelittiano.github.io/GDT/?page=scrivici&sent=ok" />

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- COLONNA DI SINISTRA -->
            <div class="form-group">
                <label for="user_name" class="form-label">👤 Nome Completo *</label>
                <input type="text" id="user_name" name="name" class="form-input" 
                    autocomplete="name" required placeholder="Mario Rossi" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">
                
                <label for="user_email" class="form-label">✉️ La tua Email *</label>
                <input type="email" id="user_email" name="email" class="form-input" 
                    autocomplete="email" required placeholder="mario@email.it" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">
                
                <label for="message" class="form-label">💬 Il tuo Messaggio *</label>
                <textarea id="message" name="message" class="form-input" rows="8" 
                        autocomplete="off" required placeholder="Scrivi qui il tuo messaggio..." style="width: 100%; box-sizing: border-box; resize: vertical;"></textarea>
            </div>

            <!-- COLONNA DI DESTRA -->
            <div class="form-group" style="display: flex; flex-direction: column; justify-content: space-between;">
                
                <!-- Parte superiore: Campo Telefono -->
                <div>
                    <label for="user_phone" class="form-label">📱 Numero di Telefono (Opzionale)</label>
                    <input type="tel" id="user_phone" name="telefono" class="form-input" 
                        autocomplete="tel" placeholder="333 1234567" style="width: 100%; box-sizing: border-box;">
                </div>
                
                <!-- Contenitore inferiore: Bottone + Nota di Attenzione -->
                <div style="margin-top: 54px;">
                    <!-- Pulsante Invia Messaggio -->
                    <p style="text-align: center !important; margin: 0 0 20px 0;">
                        <button type="submit" id="submit-btn" class="btn-invia" style="width: 100%; box-sizing: border-box; padding: 12px 0;">
                            <span id="btn-text">📨 Invia Messaggio</span>
                            <span id="btn-loading" style="display: none;">⏳ Invio in corso...</span>
                        </button>
                    </p>

                    <!-- Blocco Nota Attenzione -->
                    <div class="note-evidenziate" style="padding: 10px; border-radius: 8px;"> 
                        <p style="text-align: center !important; margin: 0;">
                            <strong>*** Attenzione ***<br>
                            Limitare l'uso dei dati sensibili.</strong>
                        </p>
                    </div>
                </div>

            </div>
        </div>
        
        <!-- Stato dell'invio -->
        <div id="form-status" style="text-align: center; margin-top: 15px; font-weight: bold; font-size: 1.05rem;"></div>
    </form>
</div>

<!-- Script Web3Forms (versione formsubmit style) -->
<script>
(function() {
    'use strict';

    console.log('🚀 Script Web3Forms caricato!');

    const form = document.getElementById('contact-form');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnLoading = document.getElementById('btn-loading');
    const statusDiv = document.getElementById('form-status');

    if (!form || !btn) {
        console.error('❌ Elementi del form non trovati!');
        return;
    }

    // 🔑 Recupera la chiave di accesso
    const accessKeyInput = form.querySelector('input[name="access_key"]');
    const accessKey = accessKeyInput ? accessKeyInput.value : null;

    if (!accessKey || accessKey === 'YOUR_ACCESS_KEY_HERE') {
        console.warn('⚠️ Inserisci la tua access_key di Web3Forms!');
        statusDiv.innerHTML = '⚠️ Configurazione mancante: inserisci la access_key.';
        statusDiv.style.color = '#ff9800';
        return;
    }

    const WEB3FORMS_ENDPOINT = 'https://api.web3forms.com/submit';

    // Gestione submit
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        e.stopPropagation();

        console.log('🔘 Submit del form!');

        // Raccogli i campi
        const name = document.getElementById('user_name').value.trim();
        const email = document.getElementById('user_email').value.trim();
        const telefono = document.getElementById('user_phone').value.trim();
        const message = document.getElementById('message').value.trim();

        // Validazione
        if (!name) {
            statusDiv.innerHTML = '❌ Inserisci il tuo Nome.';
            statusDiv.style.color = '#dc3545';
            document.getElementById('user_name').focus();
            return;
        }
        if (!email || !email.includes('@')) {
            statusDiv.innerHTML = '❌ Inserisci una Email valida.';
            statusDiv.style.color = '#dc3545';
            document.getElementById('user_email').focus();
            return;
        }
        if (!message) {
            statusDiv.innerHTML = '❌ Scrivi il tuo messaggio.';
            statusDiv.style.color = '#dc3545';
            document.getElementById('message').focus();
            return;
        }

        // Stato caricamento
        btn.disabled = true;
        btnText.style.display = 'none';
        btnLoading.style.display = 'inline';
        statusDiv.innerHTML = '⏳ Invio in corso...';
        statusDiv.style.color = '#0886f5fb';

        // 🔥 SUBJECT DINAMICO
        const subject = `Messaggio dal sito Gente del Titano da ${name}`;

        // Payload
        const payload = {
            access_key: accessKey,
            name: name,
            email: email,
            telefono: telefono || 'Non indicato',
            message: message,
            subject: subject,
            _template: 'basic',
            _captcha: 'false'
        };

        console.log('📤 Invio payload:', payload);

        fetch(WEB3FORMS_ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            console.log('📥 Risposta:', response.status);
            if (!response.ok) {
                return response.json().then(err => {
                    throw new Error(err.message || 'Errore del server');
                });
            }
            return response.json();
        })
        .then(data => {
            console.log('✅ Successo:', data);
            if (data.success) {
                statusDiv.innerHTML = '✅ Messaggio inviato con successo!';
                statusDiv.style.color = '#28a745';
                form.reset();
            } else {
                throw new Error(data.message || 'Errore sconosciuto');
            }
        })
        .catch(error => {
            console.error('❌ Errore:', error);
            statusDiv.innerHTML = `❌ Errore: ${error.message || 'Riprova più tardi.'}`;
            statusDiv.style.color = '#dc3545';
        })
        .finally(() => {
            btn.disabled = false;
            btnText.style.display = 'inline';
            btnLoading.style.display = 'none';
            setTimeout(() => {
                if (statusDiv.innerHTML.includes('successo')) {
                    statusDiv.innerHTML = '';
                }
            }, 10000);
        });
    });

    console.log('✅ Form Web3Forms pronto!');
    statusDiv.innerHTML = '✅ Pronto per l\'invio!';
    statusDiv.style.color = '#28a745';
    setTimeout(() => { statusDiv.innerHTML = ''; }, 3000);

})();
</script>
